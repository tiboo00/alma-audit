# Sample configuration for alma-audit.
#
# All keys are optional — built-in defaults already point at
# /var/log/apache2 + /var/log/apache2/domlogs. Use this file to:
#   * point the toolkit at a non-standard log root,
#   * tune rule thresholds,
#   * enable/disable individual analyzers.

paths:
  apache_root: /var/log/apache2
  domlog_root: /var/log/apache2/domlogs
  # Multi-root domlog discovery (AISO-194). On CloudLinux + cPanel hosts
  # both /var/log/apache2/domlogs and /usr/local/apache/domlogs are
  # typically populated. When `domlog_roots` is set, the analyzer walks
  # all listed roots and the well-formed count + anomaly list are the
  # SUM across roots (no dedup — the analyzer sees bare paths, not
  # realpaths). Leave empty (the default) to fall back to `domlog_root`.
  domlog_roots: []
  # Glob patterns (one basename per entry). The analyzer globs the
  # apache_root against each pattern.
  access_log_glob:
    - "access_log"
    - "access_log.*"
  error_log_glob:
    - "error_log"
    - "error_log.*"
  modsec_log_glob:
    - "modsec_audit*"

  # Quick-win analyzers (GAPS §4 / AISO-186). Each root is a directory;
  # the matching glob expands under that directory.
  secure_log_root: /var/log
  secure_log_glob:
    - "secure"
    - "secure.*"
    - "secure-*"
  auth_log_glob:
    - "auth.log"
    - "auth.log.*"
    - "auth.log-*"
  cphulk_log_root: /var/log
  cphulk_log_glob:
    - "cphulkd.log"
    - "cphulkd.log.*"
    - "cphulkd.log-*"
  ssl_cert_roots:
    - /var/cpanel/ssl
    - /etc/pki/tls/certs
    - /etc/ssl/certs
  ssl_cert_glob:
    - "*.pem"
    - "*.crt"
    - "*.cert"
  csf_deny_paths:
    - /etc/csf/csf.deny
  csf_allow_paths:
    - /etc/csf/csf.allow

  # AISO-209: SSH daemon config + drop-ins. Override either field
  # to point at a non-standard location (e.g. for testing, or for
  # hosts where sshd runs under a chroot). The CLI flag
  # `--ssh-config PATH` overrides the main path only.
  ssh_config_path: /etc/ssh/sshd_config
  ssh_drop_in_dir: /etc/ssh/sshd_config.d

modules:
  access_log:
    top_host_share_warn: 0.30
    top_host_share_crit: 0.70
    error_rate_warn: 0.05
    error_rate_crit: 0.20
    probe_count_warn: 10
    probe_count_crit: 100
    weird_method_count_warn: 5
    max_files_scanned: 50
    # Per-file line cap. 0 = no cap. Default: 200,000.
    max_lines_per_file: 200000
    # AISO-204: bandwidth anomaly detection. The rule applies only
    # when the access_log holds at least `bandwidth_hog_min_lines`
    # rows (default 1000) — on a tiny log a single host is
    # mechanically dominant. `bandwidth_hog_warn` / `_crit` are the
    # share-of-total-bytes thresholds that gate WARN / CRITICAL.
    bandwidth_hog_min_lines: 1000
    bandwidth_hog_warn: 0.50
    bandwidth_hog_crit: 0.80
    # AISO-208: cap on the per-IP distinct UA list that feeds the
    # `top_attackers` rollup. The per-(path, ip) forensic detail in
    # `probe_paths_by_ip` is uncapped; this is the operator-eye
    # rollup bound. Negative disables the cap (operator opts into
    # unbounded cost on UA-diverse per-IP traffic).
    ip_user_agent_cap: 5

  domlog_inventory:
    max_entries: 1000
    max_subdir_depth: 1
    max_files: 10000
    # AISO-207: filename length heuristics. Real domains rarely
    # exceed 60 chars; anything past 120 is almost always a fuzz
    # artifact. Override to relax/tighten the WARN / CRITICAL bars.
    length_warn: 60
    length_crit: 120
    # AISO-207: repeated-character fuzzing detector. A single char
    # >= `repeat_ratio` of the name AND name length >= `repeat_min_len`
    # trips `repeated_character_pattern`. Lower `repeat_min_len` to
    # catch shorter fuzz names.
    repeat_min_len: 20
    repeat_ratio: 0.8

  modsec_log:
    error_5xx_warn: 5
    error_5xx_crit: 50
    modsec_deny_warn: 1
    modsec_deny_crit: 50
    max_files: 20
    max_lines_per_file: 200000
    # AISO-207: how many severity=CRITICAL rule hits must accumulate
    # before the analyzer escalates to a CRITICAL finding. Default 1
    # preserves the historical "any single CRITICAL match fires"
    # behaviour; raise this on noisy test hosts.
    critical_hit_count: 1

  # --- AISO-186 quick-win analyzers ---

  secure_log:
    # SSH brute-force burst from a single IP (combined
    # credential-stuffing + username-enumeration total).
    ssh_fail_warn: 5
    ssh_fail_crit: 20
    # AISO-207: separate threshold pair for username enumeration
    # (`Invalid user X from <ip>`). Defaults mirror the ssh_fail pair
    # above; raise to suppress pages on a known scanner landscape.
    ssh_invalid_user_warn: 5
    ssh_invalid_user_crit: 20
    # sudo authentication failure burst from a single user.
    sudo_fail_warn: 3
    sudo_fail_crit: 10
    # Disable to skip the UID=0 useradd CRITICAL rule entirely.
    new_root_account_enabled: true
    max_files: 20
    max_lines_per_file: 200000
    # AISO-201: explicit self-IP allowlist. SSH / sudo events from
    # these IPs are skipped in the brute-force counters so cPanel
    # cron / monitoring noise doesn't trip CRITICAL findings. The
    # auto-detector (socket.gethostbyname) covers most hosts, but
    # NAT'd or multi-NIC boxes may need an explicit list.
    trusted_ips: []

  cphulk_log:
    brute_force_warn: 5
    brute_force_crit: 20
    brute_force_user_warn: 5
    brute_force_user_crit: 20
    max_files: 10
    max_lines_per_file: 200000

  ssl_cert:
    # Certs expiring within warn days → WARN; within crit → CRITICAL.
    expiry_warn_days: 14
    expiry_crit_days: 3
    max_files: 200

  csf_state:
    deny_count_warn: 200
    deny_count_crit: 2000
    # Trend baseline. Set to an integer to enable the growth / shrinkage
    # findings; leave null (or omit) to skip them.
    deny_baseline: null
    deny_growth_warn: 100
    deny_growth_crit: 500

  # AISO-209: SSH daemon hardening audit (sshd_config + drop-ins).
  # The analyzer flags PermitRootLogin yes / Protocol 1 / empty
  # passwords as CRITICAL; password auth, default port, large
  # MaxAuthTries / LoginGraceTime, missing allowlist and weak
  # Ciphers / MACs as WARN; X11Forwarding yes / no Banner /
  # PermitRootLogin prohibit-password as INFO. Thresholds:
  ssh_hardening:
    # ``modules.ssh_hardening.config_path`` (the issue-spec key)
    # overrides ``paths.ssh_config_path`` for this module only.
    # The default (``/etc/ssh/sshd_config``) is the right answer
    # for nearly every host — set this only when sshd lives under
    # a non-standard location (e.g. chroot, container, custom
    # build). ``drop_in_dir`` is the matching drop-in directory;
    # if only ``config_path`` is set, the analyzer derives
    # ``drop_in_dir`` as ``<parent of config_path>/sshd_config.d``.
    # config_path: /etc/ssh/sshd_config
    # drop_in_dir: /etc/ssh/sshd_config.d
    # `MaxAuthTries` greater than this is a WARN.
    # 6 matches the CIS Benchmark upper bound.
    max_auth_tries_warn: 6
    # `LoginGraceTime` (seconds) greater than this is a WARN.
    # 120 matches the OpenSSH default + CIS Benchmark upper bound.
    login_grace_time_warn: 120

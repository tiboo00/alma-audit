# A hardened /etc/ssh/sshd_config used by the AISO-209 test suite.
# Acceptance criterion #6: assert zero CRITICAL, zero WARN against
# this file.
#
# Posture summary:
#   - CRITICAL — none
#   - WARN     — none
#   - INFO     — PermitRootLogin prohibit-password,
#                X11Forwarding yes (still yes — operator choice),
#                no Banner (operator may add later)
#
# Note: this fixture keeps ``X11Forwarding yes`` and has no Banner,
# so the analyzer will emit TWO INFO findings. The acceptance
# criterion only requires zero CRITICAL + zero WARN, not zero
# findings — these are by design.

PermitRootLogin prohibit-password
PermitEmptyPasswords no
Protocol 2
PasswordAuthentication no
PubkeyAuthentication yes

# --- non-default port (anything != 22) ---
Port 5022
MaxAuthTries 3
ClientAliveInterval 300
ClientAliveCountMax 2
LoginGraceTime 30

# --- modern algorithm lists ---
Ciphers chacha20-poly1305@openssh.com,aes128-ctr,aes192-ctr,aes256-ctr,aes128-gcm@openssh.com,aes256-gcm@openssh.com
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,umac-128-etm@openssh.com,hmac-sha2-512,hmac-sha2-256

# --- explicit allowlist (closes the WARN rule) ---
AllowGroups ssh-admins

# --- misc ---
X11Forwarding yes
# (intentionally no Banner — the audit emits an INFO finding)

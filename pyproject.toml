[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "alma-audit"
version = "0.1.0"
description = "Modular, read-only Python audit toolkit for AlmaLinux WHMCS/cPanel hosts."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AISO Backend-1" }]
keywords = ["security", "audit", "apache", "modsecurity", "whmcs", "cpanel", "almalinux"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security",
]
dependencies = [
    "PyYAML>=5.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
]
ssl = [
    # Required by the ssl_cert analyzer (X.509 PEM parsing).
    # Optional because most cPanel hosts don't run alma-audit with
    # cert-expiry checks enabled; operators who want it install
    # `pip install alma-audit[ssl]`. Without it the ssl_cert
    # analyzer emits a single WARN finding naming the dependency.
    "cryptography>=42",
]

[project.scripts]
alma-audit = "alma_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"

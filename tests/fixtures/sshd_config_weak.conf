# A deliberately weak /etc/ssh/sshd_config used by the AISO-209
# test suite. Every finding the audit emits against this file is
# covered by a regression test in tests/test_ssh_hardening.py.
#
# Posture summary (acceptance criterion #3):
#   - CRITICAL  PermitRootLogin yes
#   - CRITICAL  PermitEmptyPasswords yes
#   - CRITICAL  Protocol 2,1   (SSH-1 enabled)
#   - WARN      PasswordAuthentication yes  (PubkeyAuthentication also yes)
#   - WARN      Port 22  (default port)
#   - WARN      MaxAuthTries 10
#   - WARN      ClientAliveInterval 0
#   - WARN      LoginGraceTime 300
#   - WARN      no AllowUsers / AllowGroups
#   - WARN      weak Ciphers: 3des-cbc, arcfour
#   - WARN      weak MACs: hmac-md5
#   - INFO      X11Forwarding yes
#   - INFO      no Banner
#
# Notes:
#   - The "comments" are real `#` comments — the parser skips them.
#   - "PermitRootLogin yes" appears once (last-wins — there are no
#     drop-ins overriding it). This is the only line the test for
#     ``rule_permit_root_login`` reads back.

# --- authentication posture (deliberately weak) ---
PermitRootLogin yes
PermitEmptyPasswords yes
Protocol 2,1
PasswordAuthentication yes
PubkeyAuthentication yes

# --- network / connection posture ---
Port 22
MaxAuthTries 10
ClientAliveInterval 0
LoginGraceTime 300

# --- algorithms ---
Ciphers aes128-ctr,3des-cbc,arcfour,aes256-ctr
MACs hmac-sha2-512,hmac-md5,hmac-sha2-256

# --- misc ---
X11Forwarding yes
# (intentionally no Banner directive)
